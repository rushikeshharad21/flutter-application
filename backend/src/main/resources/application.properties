spring.application.name=academic

# Server port (Render PORT देतो; local मध्ये 8080)
server.port=${PORT:8080}

# Database: environment variables मधून वाचतो.
# Variables दिले नाहीत तर local H2 file database वापरतो.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/academicdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console फक्त local साठी
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console